    <script>
      // Defensive patch: prevent "Cannot set property fetch of #<Window> which has only a getter"
      // when browser extensions or interceptors assign window.fetch = ...
      (function() {
        try {
          var rawFetch = window.fetch;
          if (typeof rawFetch === 'function') {
            var currentFetch = function() {
              return rawFetch.apply(window, arguments);
            };
            var propConfig = {
              configurable: true,
              enumerable: true,
              get: function() {
                return currentFetch;
              },
              set: function(fn) {
                currentFetch = fn;
              }
            };
            try {
              Object.defineProperty(window, 'fetch', propConfig);
            } catch (_) {}
            if (typeof Window !== 'undefined' && Window.prototype) {
              try {
                Object.defineProperty(Window.prototype, 'fetch', propConfig);
              } catch (_) {}
            }
          }
        } catch (_) {}
      })();
    </script>
    <script>
      // Immediate theme initialization to avoid white flash
      try {
        var theme = localStorage.getItem('patrol_smesa_theme_v1');
        if (theme === 'dark' || (!theme && window.matchMedia && window.matchMedia('(prefers-color-scheme: dark)').matches)) {
          document.documentElement.classList.add('dark');
        } else {
          document.documentElement.classList.remove('dark');
        }
      } catch (_) {}
    </script>
